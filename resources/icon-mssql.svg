<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="mssql-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#004e8c"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="mssql-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#50a0e8"/>
      <stop offset="100%" stop-color="#1e7ad4"/>
    </linearGradient>
  </defs>
  <!-- Cylinder body -->
  <rect x="2.5" y="5" width="11" height="7.5" fill="url(#mssql-body)"/>
  <!-- Top ellipse lid -->
  <ellipse cx="8" cy="5" rx="5.5" ry="1.8" fill="url(#mssql-top)"/>
  <!-- Middle ring -->
  <ellipse cx="8" cy="8.8" rx="5.5" ry="1.8" fill="none" stroke="#83c0f0" stroke-width="0.5" opacity="0.5"/>
  <!-- Bottom ellipse shadow -->
  <ellipse cx="8" cy="12.5" rx="5.5" ry="1.8" fill="#003e74"/>
  <!-- Lid shine -->
  <path d="M4.8 4.3 Q8 3.1 11.2 4.3" stroke="white" stroke-width="0.6" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
